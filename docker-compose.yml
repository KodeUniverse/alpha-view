services:
  frontend-server:
    env_file:
      - .env
    build:
      context: .
      dockerfile: frontend/Dockerfile
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
    ports:
      - "${HOST_PORT}:5379"
    depends_on:
      backend-server:
        condition: service_healthy

  backend-server:
    env_file:
      - .env
    build:
      context: .
      dockerfile: backend/Dockerfile
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv
            - __pycache__
            - "**/*.pyc"
    ports:
      - "${HOST_API_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://0.0.0.0:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
