services:
  frontend-server:
    env_file:
      - .env
    build:
      context: .
      dockerfile: frontend/Dockerfile
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
    ports:
      - "${HOST_PORT}:5379"
    depends_on:
      backend-server:
        condition: service_healthy

  backend-server:
    env_file:
      - .env
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      # The SQLite file is bind-mounted instead of being left in the container's writable
      # layer. `develop.watch` syncs host -> container only, so with no mount the app's
      # writes never reach the host copy, and `make restart` (which runs `docker compose
      # down`) destroys every watchlist added since the host file was written.
      #
      # The host file MUST exist before the first `up`. Docker creates a *directory* at a
      # missing bind-mount source, and SQLite cannot open a directory as a database file.
      - ./backend/alphaview.db:/app/alphaview.db
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv
            - __pycache__
            - "**/*.pyc"
            # Bind-mounted above; re-syncing it onto its own mountpoint would just be the
            # container writing the host file through to itself.
            - "*.db"
            - "*.sqlite"
    ports:
      - "${HOST_API_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://0.0.0.0:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
