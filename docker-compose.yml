services:
  frontend-server:
    env_file:
      - .env
    build:
      context: .
      dockerfile: frontend/Dockerfile
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
    ports:
      - "${HOST_PORT}:5379"
    depends_on:
      backend-server:
        condition: service_healthy

  backend-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - node_modules
    ports:
      - "${HOST_API_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://0.0.0.0:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
