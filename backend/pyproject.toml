[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alpaca-py>=0.44.0",
    "fastapi[standard]>=0.141.1",
    "finnhub-python>=2.4.29",
    "sqlalchemy[asyncio]>=2.0.52",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
]

[tool.basedpyright]
typeCheckingMode = "recommended"

reportAny = "warning"
reportExplicitAny = "information"
reportUnusedParameter = "error"
reportUnusedCallResult = false 
